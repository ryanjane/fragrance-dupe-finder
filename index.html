<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find fragrance dupes, clones, and inspired-by alternatives.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <title>Fragrance Dupe Finder</title>
  
  <style>
    :root {
      --surface-0: #f1efe8;
      --surface-1: #f9f8f5;
      --surface-2: #ffffff;
      --text-primary: #2c2c2a;
      --text-secondary: #888780;
      --text-muted: #b4b2a9;
      --border: rgba(44, 44, 42, 0.08);
      --border-strong: rgba(44, 44, 42, 0.16);
      --border-accent: rgba(24, 95, 165, 0.2);
      --fill-accent: #185FA5;
      --on-accent: #ffffff;
      --text-accent: #185FA5;
      --bg-accent: rgba(24, 95, 165, 0.1);
      --fill-success: #3b6d11;
      --text-success: #3b6d11;
      --bg-success: rgba(59, 109, 17, 0.1);
      --fill-danger: #a32d2d;
      --text-danger: #a32d2d;
      --bg-danger: rgba(163, 45, 45, 0.1);
      --border-danger: rgba(163, 45, 45, 0.2);
      --bg-secondary: rgba(136, 135, 128, 0.1);
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface-0: #2c2c2a;
        --surface-1: #444441;
        --surface-2: #2c2c2a;
        --text-primary: #f1efe8;
        --text-secondary: #b4b2a9;
        --text-muted: #888780;
        --border: rgba(241, 239, 232, 0.12);
        --border-strong: rgba(241, 239, 232, 0.2);
        --border-accent: rgba(181, 212, 244, 0.2);
        --fill-accent: #4a8de8;
        --text-accent: #b5d4f4;
        --bg-accent: rgba(181, 212, 244, 0.15);
        --fill-success: #97c459;
        --text-success: #c0dd97;
        --bg-success: rgba(192, 221, 151, 0.15);
        --fill-danger: #f09595;
        --text-danger: #f7c1c1;
        --bg-danger: rgba(247, 193, 193, 0.15);
        --border-danger: rgba(247, 193, 193, 0.2);
        --bg-secondary: rgba(181, 212, 244, 0.1);
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--surface-0);
      color: var(--text-primary);
      line-height: 1.6;
    }
    #root { display: flex; flex-direction: column; min-height: 100vh; }
    input, select, textarea, button { font-family: inherit; font-size: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(24, 95, 165, 0.1), 0 0 0 4px rgba(24, 95, 165, 0.05); }
    button { cursor: pointer; transition: all 0.2s ease; }
    button:active { transform: scale(0.98); }
    a { color: var(--fill-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initialize Supabase
    const SUPABASE_URL = 'https://zbsgcqrlqtcauyuisidg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8K0tGl4oNm_XDtTBAcKaOQ_ieVWiMCn';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function FragranceDupeApp() {
      const [user, setUser] = useState(null);
      const [view, setView] = useState('search');
      const [searchTerm, setSearchTerm] = useState('');
      const [fragrances, setFragrances] = useState([]);
      const [collections, setCollections] = useState({});
      const [selectedFrag, setSelectedFrag] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [loading, setLoading] = useState(false);

      // Fetch fragrances from Supabase
      useEffect(() => {
        if (user) {
          fetchFragrances();
        }
      }, [user]);

      const fetchFragrances = async () => {
        setLoading(true);
        try {
          const { data, error } = await supabase
            .from('fragrances')
            .select('*')
            .order('created_at', { ascending: false });
          
          if (error) throw error;
          setFragrances(data || []);
        } catch (err) {
          console.error('Error fetching fragrances:', err);
          alert('Error loading fragrances. Please refresh the page.');
        }
        setLoading(false);
      };

      const searchResults = fragrances.filter(frag =>
        frag.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        frag.house.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const handleLogin = (email) => {
        setUser({ email, id: Date.now().toString() });
        setCollections({});
        setIsAdmin(email.includes('admin'));
      };

      const handleLogout = () => {
        setUser(null);
        setView('search');
      };

      const toggleCollection = (fragId) => {
        setCollections(prev => ({ ...prev, [fragId]: !prev[fragId] }));
      };

      const addFragrance = async (fragData) => {
        try {
          const { data, error } = await supabase
            .from('fragrances')
            .insert([fragData])
            .select();
          
          if (error) throw error;
          setFragrances([...fragrances, ...data]);
          alert('Fragrance added successfully!');
        } catch (err) {
          console.error('Error adding fragrance:', err);
          alert('Error adding fragrance: ' + err.message);
        }
      };

      if (!user) {
        return <LoginView onLogin={handleLogin} />;
      }

      return (
        <div style={{ minHeight: '100vh', background: 'var(--surface-0)' }}>
          <header style={{ background: 'var(--surface-2)', borderBottom: '0.5px solid var(--border)', padding: '1rem', position: 'sticky', top: 0, zIndex: 100 }}>
            <div style={{ maxWidth: '1000px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h1 style={{ margin: 0, fontSize: '18px', fontWeight: 500 }}>Fragrance Dupe Finder</h1>
                <p style={{ margin: '4px 0 0', fontSize: '13px', color: 'var(--text-secondary)' }}>{user.email}</p>
              </div>
              <div style={{ display: 'flex', gap: '8px' }}>
                {isAdmin && <button onClick={() => setView(view === 'admin' ? 'search' : 'admin')} style={{ padding: '8px 16px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border-strong)', background: view === 'admin' ? 'var(--surface-1)' : 'transparent', cursor: 'pointer', fontSize: '14px' }}>Admin</button>}
                <button onClick={handleLogout} style={{ padding: '8px 16px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border-strong)', background: 'transparent', cursor: 'pointer', fontSize: '14px' }}>Sign out</button>
              </div>
            </div>
          </header>

          <nav style={{ background: 'var(--surface-1)', borderBottom: '0.5px solid var(--border)', padding: '0.75rem 1rem', display: 'flex', gap: '8px', justifyContent: 'center', flexWrap: 'wrap' }}>
            {['search', 'collections', 'sources'].map(tab => (
              <button key={tab} onClick={() => setView(tab)} style={{ padding: '6px 12px', borderRadius: 'var(--radius)', border: view === tab ? '0.5px solid var(--border-accent)' : '0.5px solid var(--border)', background: view === tab ? 'var(--bg-accent)' : 'transparent', color: view === tab ? 'var(--text-accent)' : 'var(--text-primary)', cursor: 'pointer', fontSize: '14px', textTransform: 'capitalize' }}>
                {tab}
              </button>
            ))}
          </nav>

          <main style={{ maxWidth: '1000px', margin: '0 auto', padding: '2rem 1rem' }}>
            {view === 'search' && <SearchView fragrances={searchResults} allFragrances={fragrances} searchTerm={searchTerm} setSearchTerm={setSearchTerm} onSelect={setSelectedFrag} selectedFrag={selectedFrag} onToggleCollection={toggleCollection} isInCollection={collections} loading={loading} />}
            {view === 'collections' && <CollectionsView fragrances={fragrances} inCollection={collections} onToggleCollection={toggleCollection} />}
            {view === 'sources' && <SourcesView />}
            {view === 'admin' && isAdmin && <AdminView fragrances={fragrances} onAddFragrance={addFragrance} />}
          </main>
        </div>
      );
    }

    function LoginView({ onLogin }) {
      const [email, setEmail] = useState('');
      const handleSubmit = (e) => {
        e.preventDefault();
        if (email) onLogin(email);
      };
      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--surface-0)', padding: '1rem' }}>
          <div style={{ background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: '12px', padding: '2rem', maxWidth: '400px', width: '100%' }}>
            <h1 style={{ margin: '0 0 1rem', fontSize: '24px', fontWeight: 500 }}>Fragrance Dupe Finder</h1>
            <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem' }}>Find dupes, clones, and inspired fragrances</p>
            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontSize: '14px', fontWeight: 500 }}>Email</label>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" style={{ width: '100%', padding: '10px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }} required />
                <p style={{ fontSize: '12px', color: 'var(--text-secondary)', margin: '8px 0 0' }}>Tip: Use "admin@example.com" to add fragrances</p>
              </div>
              <button type="submit" style={{ padding: '10px 16px', background: 'var(--fill-accent)', color: 'var(--on-accent)', border: 'none', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '14px', fontWeight: 500 }}>
                Sign in
              </button>
            </form>
          </div>
        </div>
      );
    }

    function SearchView({ fragrances, allFragrances, searchTerm, setSearchTerm, onSelect, selectedFrag, onToggleCollection, isInCollection, loading }) {
      return (
        <div>
          <div style={{ marginBottom: '2rem' }}>
            <input type="text" placeholder="Search by fragrance name or house..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} style={{ width: '100%', padding: '12px 16px', fontSize: '16px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box' }} />
          </div>
          {selectedFrag ? (
            <FragranceDetail frag={selectedFrag} onBack={() => onSelect(null)} onToggleCollection={onToggleCollection} isInCollection={isInCollection[selectedFrag.id]} allFragrances={allFragrances} onSelectFrag={onSelect} />
          ) : (
            <div style={{ display: 'grid', gap: '12px' }}>
              {loading ? (
                <p style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem' }}>Loading fragrances...</p>
              ) : fragrances.length === 0 ? (
                <p style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem' }}>No fragrances found. Try a different search or sign in as admin to add one!</p>
              ) : (
                fragrances.map(frag => (
                  <FragranceCard key={frag.id} frag={frag} onSelect={() => onSelect(frag)} onToggleCollection={() => onToggleCollection(frag.id)} isInCollection={isInCollection[frag.id]} />
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    function FragranceCard({ frag, onSelect, onToggleCollection, isInCollection }) {
      const dupeType = frag.type === 'clone' ? 'Clone' : frag.type === 'inspired' ? 'Inspired' : 'Original';
      return (
        <div style={{ background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: '12px', padding: '1rem', cursor: 'pointer' }} onClick={onSelect} onMouseEnter={(e) => e.currentTarget.style.borderColor = 'var(--border-strong)'} onMouseLeave={(e) => e.currentTarget.style.borderColor = 'var(--border)'}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '8px' }}>
            <div>
              <h3 style={{ margin: 0, fontSize: '16px', fontWeight: 500 }}>{frag.name}</h3>
              <p style={{ margin: '4px 0 0', fontSize: '14px', color: 'var(--text-secondary)' }}>{frag.house}</p>
            </div>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <span style={{ background: frag.type === 'original' ? 'var(--bg-accent)' : 'var(--bg-success)', color: frag.type === 'original' ? 'var(--text-accent)' : 'var(--text-success)', padding: '4px 12px', borderRadius: 'var(--radius)', fontSize: '12px', fontWeight: 500 }}>{dupeType || 'Original'}</span>
              <button onClick={(e) => { e.stopPropagation(); onToggleCollection(); }} style={{ background: isInCollection ? 'var(--fill-accent)' : 'transparent', color: isInCollection ? 'var(--on-accent)' : 'var(--text-primary)', border: '0.5px solid ' + (isInCollection ? 'var(--border-accent)' : 'var(--border)'), padding: '6px 12px', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '12px' }}>
                {isInCollection ? '★ Saved' : '☆ Save'}
              </button>
            </div>
          </div>
          {frag.price && <p style={{ margin: '8px 0', fontSize: '13px', color: 'var(--text-secondary)' }}>💰 ${frag.price}</p>}
          {frag.accuracy && <p style={{ margin: '8px 0 0', fontSize: '13px' }}>⭐ {frag.accuracy}/5 accuracy</p>}
        </div>
      );
    }

    function FragranceDetail({ frag, onBack, onToggleCollection, isInCollection, allFragrances, onSelectFrag }) {
      const [showComparison, setShowComparison] = useState(false);
      const original = frag.compared_to_id ? allFragrances.find(f => f.id === frag.compared_to_id) : null;
      const dupes = allFragrances.filter(f => f.compared_to_id === frag.id && f.id !== frag.id);

      return (
        <div style={{ maxWidth: '700px' }}>
          <button onClick={onBack} style={{ marginBottom: '1rem', padding: '8px 16px', background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '14px' }}>
            ← Back
          </button>

          <div style={{ background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: '12px', padding: '2rem' }}>
            <h1 style={{ margin: '0 0 0.5rem', fontSize: '24px', fontWeight: 500 }}>{frag.name}</h1>
            <p style={{ margin: '0 0 1.5rem', fontSize: '16px', color: 'var(--text-secondary)' }}>{frag.house}</p>

            {original && (
              <div style={{ background: 'var(--bg-success)', padding: '1rem', borderRadius: 'var(--radius)', marginBottom: '1.5rem', border: '0.5px solid var(--border-success)' }}>
                <p style={{ margin: '0 0 8px', fontSize: '13px', color: 'var(--text-success)', fontWeight: 500 }}>
                  {frag.type === 'clone' ? 'CLONE OF' : frag.type === 'inspired' ? 'INSPIRED BY' : 'SIMILAR TO'}
                </p>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <p style={{ margin: 0, fontSize: '16px', fontWeight: 500, color: 'var(--text-primary)' }}>{original.name}</p>
                    <p style={{ margin: '4px 0 0', fontSize: '13px', color: 'var(--text-secondary)' }}>{original.house} {original.price && `· $${original.price}`}</p>
                  </div>
                  <button onClick={() => { onSelectFrag(original); setShowComparison(false); }} style={{ padding: '6px 12px', background: 'var(--fill-accent)', color: 'var(--on-accent)', border: 'none', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '12px', whiteSpace: 'nowrap' }}>
                    View Original
                  </button>
                </div>
              </div>
            )}

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem', marginBottom: '1.5rem' }}>
              {frag.price && (
                <div style={{ background: 'var(--surface-1)', padding: '1rem', borderRadius: 'var(--radius)' }}>
                  <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-secondary)' }}>Price</p>
                  <p style={{ margin: '4px 0 0', fontSize: '18px', fontWeight: 500 }}>${frag.price}</p>
                </div>
              )}
              {frag.accuracy && (
                <div style={{ background: 'var(--surface-1)', padding: '1rem', borderRadius: 'var(--radius)' }}>
                  <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-secondary)' }}>Accuracy</p>
                  <p style={{ margin: '4px 0 0', fontSize: '18px', fontWeight: 500 }}>⭐ {frag.accuracy}/5</p>
                </div>
              )}
            </div>

            {frag.notes && (
              <div style={{ marginBottom: '1.5rem' }}>
                <h3 style={{ margin: '0 0 8px', fontSize: '14px', fontWeight: 500 }}>Notes</h3>
                <p style={{ margin: 0, fontSize: '14px', color: 'var(--text-secondary)' }}>{frag.notes}</p>
              </div>
            )}

            <div style={{ display: 'flex', gap: '8px', marginBottom: '1.5rem', flexWrap: 'wrap' }}>
              {frag.source && (
                <a href={frag.source} target="_blank" rel="noopener noreferrer" style={{ padding: '8px 16px', background: 'var(--fill-accent)', color: 'var(--on-accent)', textDecoration: 'none', borderRadius: 'var(--radius)', fontSize: '14px', cursor: 'pointer' }}>
                  View on brand site ↗
                </a>
              )}
              <button onClick={onToggleCollection} style={{ padding: '8px 16px', background: isInCollection ? 'var(--bg-success)' : 'var(--surface-1)', color: isInCollection ? 'var(--text-success)' : 'var(--text-primary)', border: '0.5px solid var(--border)', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '14px' }}>
                {isInCollection ? '✓ In your collection' : '+ Add to collection'}
              </button>
              {original && !showComparison && (
                <button onClick={() => setShowComparison(true)} style={{ padding: '8px 16px', background: 'var(--surface-1)', color: 'var(--text-primary)', border: '0.5px solid var(--border)', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '14px' }}>
                  Compare
                </button>
              )}
              {showComparison && (
                <button onClick={() => setShowComparison(false)} style={{ padding: '8px 16px', background: 'var(--bg-danger)', color: 'var(--text-danger)', border: '0.5px solid var(--border-danger)', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '14px' }}>
                  Close Comparison
                </button>
              )}
            </div>

            {showComparison && original && <ComparisonView original={original} dupe={frag} />}

            {dupes.length > 0 && (
              <div style={{ marginTop: '2rem', borderTop: '0.5px solid var(--border)', paddingTop: '1.5rem' }}>
                <h3 style={{ margin: '0 0 1rem', fontSize: '16px', fontWeight: 500 }}>
                  Dupes, Clones & Inspired Alternatives ({dupes.length})
                </h3>
                <div style={{ display: 'grid', gap: '12px' }}>
                  {dupes.map(dupe => (
                    <div key={dupe.id} style={{ background: 'var(--surface-1)', border: '0.5px solid var(--border)', borderRadius: 'var(--radius)', padding: '1rem', cursor: 'pointer' }} onClick={() => onSelectFrag(dupe)} onMouseEnter={(e) => e.currentTarget.style.borderColor = 'var(--border-strong)'} onMouseLeave={(e) => e.currentTarget.style.borderColor = 'var(--border)'}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '8px' }}>
                        <div style={{ flex: 1 }}>
                          <h4 style={{ margin: 0, fontSize: '15px', fontWeight: 500 }}>{dupe.name}</h4>
                          <p style={{ margin: '4px 0 0', fontSize: '13px', color: 'var(--text-secondary)' }}>{dupe.house}</p>
                        </div>
                        <span style={{ background: dupe.type === 'clone' ? 'var(--bg-accent)' : 'var(--bg-success)', color: dupe.type === 'clone' ? 'var(--text-accent)' : 'var(--text-success)', padding: '4px 8px', borderRadius: 'var(--radius)', fontSize: '11px', fontWeight: 500, whiteSpace: 'nowrap' }}>
                          {dupe.type === 'clone' ? 'Clone' : 'Inspired'}
                        </span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '13px' }}>
                        {dupe.price && <span>💰 ${dupe.price}</span>}
                        {dupe.accuracy && <span>⭐ {dupe.accuracy}/5 accuracy</span>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div style={{ marginTop: '2rem', background: 'var(--bg-accent)', padding: '1rem', borderRadius: 'var(--radius)' }}>
              <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-accent)' }}>
                This database is curated and cross-referenced for accuracy.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ComparisonView({ original, dupe }) {
      const savings = original.price && dupe.price ? original.price - dupe.price : null;
      const savingsPercent = savings ? Math.round((savings / original.price) * 100) : null;
      return (
        <div style={{ background: 'var(--bg-accent)', border: '0.5px solid var(--border-accent)', borderRadius: 'var(--radius)', padding: '1.5rem', marginBottom: '1.5rem' }}>
          <h3 style={{ margin: '0 0 1.5rem', fontSize: '16px', fontWeight: 500, color: 'var(--text-accent)' }}>Side-by-Side Comparison</h3>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.5rem' }}>
            <div style={{ borderRight: '1px solid rgba(0, 0, 0, 0.1)' }}>
              <p style={{ margin: '0 0 8px', fontSize: '12px', fontWeight: 500, color: 'var(--text-secondary)', textTransform: 'uppercase' }}>Original</p>
              <h4 style={{ margin: '0 0 4px', fontSize: '15px', fontWeight: 500 }}>{original.name}</h4>
              <p style={{ margin: '0 0 1rem', fontSize: '13px', color: 'var(--text-secondary)' }}>{original.house}</p>
              <div style={{ display: 'grid', gap: '12px' }}>
                {original.price && (
                  <div>
                    <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-secondary)' }}>Price</p>
                    <p style={{ margin: '4px 0 0', fontSize: '18px', fontWeight: 500 }}>${original.price}</p>
                  </div>
                )}
                {original.notes && (
                  <div>
                    <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-secondary)' }}>Notes</p>
                    <p style={{ margin: '4px 0 0', fontSize: '13px' }}>{original.notes}</p>
                  </div>
                )}
              </div>
            </div>
            <div>
              <p style={{ margin: '0 0 8px', fontSize: '12px', fontWeight: 500, color: 'var(--text-secondary)', textTransform: 'uppercase' }}>This Fragrance</p>
              <h4 style={{ margin: '0 0 4px', fontSize: '15px', fontWeight: 500 }}>{dupe.name}</h4>
              <p style={{ margin: '0 0 1rem', fontSize: '13px', color: 'var(--text-secondary)' }}>{dupe.house}</p>
              <div style={{ display: 'grid', gap: '12px' }}>
                {dupe.price && (
                  <div>
                    <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-secondary)' }}>Price</p>
                    <p style={{ margin: '4px 0 0', fontSize: '18px', fontWeight: 500 }}>
                      ${dupe.price}
                      {savings && savingsPercent && <span style={{ fontSize: '14px', color: 'var(--text-success)', marginLeft: '8px' }}>Save ${savings} ({savingsPercent}%)</span>}
                    </p>
                  </div>
                )}
                {dupe.notes && (
                  <div>
                    <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-secondary)' }}>Notes</p>
                    <p style={{ margin: '4px 0 0', fontSize: '13px' }}>{dupe.notes}</p>
                  </div>
                )}
                {dupe.accuracy && (
                  <div>
                    <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-secondary)' }}>Match Quality</p>
                    <p style={{ margin: '4px 0 0', fontSize: '13px' }}>⭐ {dupe.accuracy}/5</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CollectionsView({ fragrances, inCollection, onToggleCollection }) {
      const myFragrances = fragrances.filter(f => inCollection[f.id]);
      return (
        <div>
          <h2 style={{ marginTop: 0, marginBottom: '1.5rem', fontSize: '18px', fontWeight: 500 }}>My Fragrances</h2>
          {myFragrances.length === 0 ? (
            <p style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem' }}>
              No fragrances saved yet. Search and save your favorites.
            </p>
          ) : (
            <div style={{ display: 'grid', gap: '12px' }}>
              {myFragrances.map(frag => (
                <div key={frag.id} style={{ background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: '12px', padding: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <h3 style={{ margin: 0, fontSize: '16px', fontWeight: 500 }}>{frag.name}</h3>
                    <p style={{ margin: '4px 0 0', fontSize: '14px', color: 'var(--text-secondary)' }}>{frag.house}</p>
                  </div>
                  <button onClick={() => onToggleCollection(frag.id)} style={{ padding: '6px 12px', background: 'var(--bg-danger)', color: 'var(--text-danger)', border: '0.5px solid var(--border-danger)', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '12px' }}>
                    Remove
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function SourcesView() {
      const sources = [
        { name: 'Fragrantica', url: 'https://www.fragrantica.com', description: 'Community fragrance database with reviews' },
        { name: 'Parfumo', url: 'https://www.parfumo.de', description: 'Extensive fragrance database and forum' },
        { name: 'Basenotes', url: 'https://www.basenotes.net', description: 'Fragrance forum and database' }
      ];
      return (
        <div>
          <h2 style={{ marginTop: 0, marginBottom: '1.5rem', fontSize: '18px', fontWeight: 500 }}>Sources</h2>
          <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem' }}>
            This app cross-references multiple reliable sources to ensure accuracy.
          </p>
          <div style={{ display: 'grid', gap: '12px' }}>
            {sources.map(source => (
              <div key={source.name} style={{ background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: '12px', padding: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <h3 style={{ margin: 0, fontSize: '16px', fontWeight: 500 }}>{source.name}</h3>
                  <p style={{ margin: '4px 0 0', fontSize: '14px', color: 'var(--text-secondary)' }}>{source.description}</p>
                </div>
                <a href={source.url} target="_blank" rel="noopener noreferrer" style={{ padding: '8px 16px', background: 'var(--fill-accent)', color: 'var(--on-accent)', textDecoration: 'none', borderRadius: 'var(--radius)', fontSize: '12px', cursor: 'pointer', whiteSpace: 'nowrap' }}>
                  Visit ↗
                </a>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AdminView({ fragrances, onAddFragrance }) {
      const [formData, setFormData] = useState({
        name: '',
        house: '',
        price: '',
        notes: '',
        type: 'original',
        source: '',
        accuracy: ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.house) {
          alert('Please fill in Name and House (required fields)');
          return;
        }
        onAddFragrance({
          name: formData.name,
          house: formData.house,
          price: formData.price ? parseFloat(formData.price) : null,
          notes: formData.notes || null,
          type: formData.type || 'original',
          source: formData.source || null,
          accuracy: formData.accuracy ? parseFloat(formData.accuracy) : null,
          compared_to_id: null
        });
        setFormData({ name: '', house: '', price: '', notes: '', type: 'original', source: '', accuracy: '' });
      };

      return (
        <div style={{ maxWidth: '600px' }}>
          <h2 style={{ marginTop: 0, marginBottom: '1.5rem', fontSize: '18px', fontWeight: 500 }}>Admin Dashboard</h2>

          <div style={{ background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: '12px', padding: '1.5rem', marginBottom: '2rem' }}>
            <h3 style={{ margin: '0 0 1rem', fontSize: '16px', fontWeight: 500 }}>Add New Fragrance</h3>
            <p style={{ margin: '0 0 1rem', fontSize: '13px', color: 'var(--text-secondary)' }}>Only Name and House are required. You can add other details later!</p>

            <form onSubmit={handleSubmit} style={{ display: 'grid', gap: '1rem' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '4px', fontSize: '13px', fontWeight: 500 }}>Fragrance Name * (Required)</label>
                <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} required style={{ width: '100%', padding: '8px 12px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }} />
              </div>

              <div>
                <label style={{ display: 'block', marginBottom: '4px', fontSize: '13px', fontWeight: 500 }}>House * (Required)</label>
                <input type="text" value={formData.house} onChange={(e) => setFormData({...formData, house: e.target.value})} required style={{ width: '100%', padding: '8px 12px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }} />
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                <div>
                  <label style={{ display: 'block', marginBottom: '4px', fontSize: '13px', fontWeight: 500 }}>Price (Optional)</label>
                  <input type="number" step="0.01" value={formData.price} onChange={(e) => setFormData({...formData, price: e.target.value})} placeholder="e.g., 130" style={{ width: '100%', padding: '8px 12px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }} />
                </div>

                <div>
                  <label style={{ display: 'block', marginBottom: '4px', fontSize: '13px', fontWeight: 500 }}>Type (Optional)</label>
                  <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})} style={{ width: '100%', padding: '8px 12px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }}>
                    <option value="original">Original</option>
                    <option value="clone">Clone</option>
                    <option value="inspired">Inspired</option>
                  </select>
                </div>
              </div>

              <div>
                <label style={{ display: 'block', marginBottom: '4px', fontSize: '13px', fontWeight: 500 }}>Notes (Optional)</label>
                <input type="text" value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="e.g., bergamot, vanilla, musk" style={{ width: '100%', padding: '8px 12px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }} />
              </div>

              <div>
                <label style={{ display: 'block', marginBottom: '4px', fontSize: '13px', fontWeight: 500 }}>Accuracy Rating (Optional)</label>
                <input type="number" step="0.1" min="1" max="5" value={formData.accuracy} onChange={(e) => setFormData({...formData, accuracy: e.target.value})} placeholder="e.g., 4.2" style={{ width: '100%', padding: '8px 12px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }} />
              </div>

              <div>
                <label style={{ display: 'block', marginBottom: '4px', fontSize: '13px', fontWeight: 500 }}>Brand URL (Optional)</label>
                <input type="url" value={formData.source} onChange={(e) => setFormData({...formData, source: e.target.value})} placeholder="https://..." style={{ width: '100%', padding: '8px 12px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border)', boxSizing: 'border-box', fontSize: '14px' }} />
              </div>

              <button type="submit" style={{ padding: '10px 16px', background: 'var(--fill-accent)', color: 'var(--on-accent)', border: 'none', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '14px', fontWeight: 500 }}>
                Add Fragrance
              </button>
            </form>
          </div>

          <div>
            <h3 style={{ marginBottom: '1rem', fontSize: '16px', fontWeight: 500 }}>Database ({fragrances.length} fragrances)</h3>
            <div style={{ display: 'grid', gap: '8px' }}>
              {fragrances.length === 0 ? (
                <p style={{ color: 'var(--text-secondary)' }}>No fragrances yet. Add your first one!</p>
              ) : (
                fragrances.map(frag => (
                  <div key={frag.id} style={{ background: 'var(--surface-2)', border: '0.5px solid var(--border)', borderRadius: '12px', padding: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '14px' }}>
                    <div>
                      <strong>{frag.name}</strong> · {frag.house} {frag.price && `· $${frag.price}`}
                    </div>
                    <span style={{ background: 'var(--bg-secondary)', padding: '4px 8px', borderRadius: 'var(--radius)', fontSize: '12px' }}>
                      {frag.type || 'original'}
                    </span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FragranceDupeApp />);
  </script>
</body>
</html>
